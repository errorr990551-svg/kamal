name: Fast ZIP CI/CD Auto-Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Fast Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: 📦 Install Frontend Dependencies
        run: |
          npm --prefix frontend ci || npm --prefix frontend install

      - name: 🏗️ Build Frontend Production Dist
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://kamal.errorr990551.workers.dev' }}
        run: |
          npm --prefix frontend run build

      - name: 🔍 Verify Output & Compress (Fast ZIP)
        run: |
          echo "Checking frontend/dist contents..."
          ls -la frontend/dist
          echo "Compressing build files into deploy.zip..."
          cd frontend/dist
          zip -r -q ../../deploy.zip .
          cd ../..
          echo "deploy.zip created successfully:"
          ls -lh deploy.zip

      - name: 🚀 Install FTP Helper & Execute Fast ZIP Deploy
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          LIVE_DOMAIN: ${{ secrets.LIVE_DOMAIN }}
          HOSTINGER_DOMAIN: ${{ secrets.HOSTINGER_DOMAIN }}
        run: |
          npm install --no-save basic-ftp
          node .github/scripts/deploy.cjs

